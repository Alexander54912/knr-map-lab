<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Кэшбэк на районе</title>
  <meta name="theme-color" content="#1c1c1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Кэшбэк">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="icon" href="assets/icon-32.png">
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/pins.css">
  <link rel="stylesheet" href="css/sheet.css">
</head>
<body>
  <div class="stage">
    <div class="device">
      <div class="app" id="app">
        <div class="map" id="map"></div>

        <header class="head">
          <button class="head__back" id="back" type="button" aria-label="Назад"></button>
          <h1>Кэшбэк на районе</h1>
        </header>

        <div class="ctrl">
          <button id="zoom-in" type="button" aria-label="Приблизить"></button>
          <button id="zoom-out" type="button" aria-label="Отдалить"></button>
          <button id="locate" type="button" aria-label="Моё местоположение"></button>
        </div>

        <section class="sheet" id="sheet">
          <div class="sheet__grab" data-sheet-drag><span></span></div>
          <div class="chips" id="chips"></div>
          <div class="list" id="list"></div>
        </section>

        <button class="fab" id="to-map" type="button"></button>
        <div id="modal-root"></div>
      </div>
    </div>
  </div>
  <script src="vendor/maplibre/maplibre-gl.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
